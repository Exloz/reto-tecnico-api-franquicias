name: api-franchise-quality

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: gradle
      - name: Run tests, architecture and coverage gates
        run: ./gradlew qualityGate -x pitest -x jacocoTestReport --no-daemon --no-configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/test-results/test/*.xml
          if-no-files-found: warn

  mutation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: gradle
      - name: Run mutation testing
        run: ./gradlew pitestReportAggregate --no-daemon --no-configuration-cache
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-reports
          path: |
            **/build/reports/pitest/
            build/reports/pitest/
          if-no-files-found: warn

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
