name: api-franchise-quality

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: gradle
      - name: Run tests and quality gates
        run: ./gradlew qualityGate jacocoMergedReport --no-daemon --no-configuration-cache
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            **/build/test-results/test/*.xml
            build/reports/jacocoMergedReport/
            **/build/reports/pitest/
            build/reports/pitest/
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
