name: CI

on:
  workflow_dispatch:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_ACCOUNT_ID: '127321794531'
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          if [ "$BASE_BRANCH" = main ] && [ "$HEAD_BRANCH" != development ]; then
            printf 'Only development can be promoted to main\n' >&2
            exit 1
          fi
          if [ "$BASE_BRANCH" = development ] && { [ "$HEAD_BRANCH" = main ] || [ "$HEAD_BRANCH" = development ]; }; then
            printf 'Development accepts pull requests only from feature branches\n' >&2
            exit 1
          fi

  application-quality:
    name: Application quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run tests, architecture and coverage gates
        run: ./gradlew qualityGate jacocoMergedReport --max-workers=2 --no-daemon --no-configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports-${{ github.run_id }}
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn
          retention-days: 14

  mutation:
    name: Mutation testing
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [branch-policy, application-quality, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run mutation gates
        run: ./gradlew pitestReportAggregate --max-workers=2 --no-daemon --no-configuration-cache
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mutation-reports-${{ github.run_id }}
          path: |
            **/build/reports/pitest/
            build/reports/pitest/
          if-no-files-found: warn
          retention-days: 14

  infrastructure:
    name: Infrastructure validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6
        with:
          tflint_version: v0.59.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.73.0
          cache: true
      - name: Validate Terraform
        run: |
          set -eu
          terraform fmt -check -recursive infrastructure
          for root in bootstrap environments/dev environments/prod; do
            terraform -chdir="infrastructure/$root" init -backend=false -input=false
            terraform -chdir="infrastructure/$root" validate
            tflint --chdir="infrastructure/$root" --init
            tflint --chdir="infrastructure/$root"
          done
      - name: Scan Terraform
        run: trivy config --severity CRITICAL --ignorefile .trivyignore --exit-code 1 infrastructure

  terraform-plan:
    name: Terraform plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [branch-policy, application-quality, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan target environment
        env:
          TARGET_ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: |
          set -eu
          root="infrastructure/environments/$TARGET_ENVIRONMENT"
          terraform -chdir="$root" init -input=false
          current=$(terraform -chdir="$root" output -json release_digests 2>/dev/null || printf '{}')
          set --
          for component in api migrations bootstrap; do
            digest=$(printf '%s' "$current" | jq -r --arg component "$component" '.[$component] // empty')
            case "$component:$digest" in
              api:sha256:*) set -- "$@" -var "api_image_digest=$digest" ;;
              migrations:sha256:*) set -- "$@" -var "migration_image_digest=$digest" ;;
              bootstrap:sha256:*) set -- "$@" -var "bootstrap_image_digest=$digest" ;;
            esac
          done
          terraform -chdir="$root" plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -var-file="$TARGET_ENVIRONMENT.tfvars" \
            "$@"

  containers:
    name: Container security
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [branch-policy, application-quality, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build application JAR
        run: |
          ./gradlew :app-service:bootJar --no-daemon --no-configuration-cache -x test
          cp applications/app-service/build/libs/ApiFranchise.jar ./ApiFranchise.jar
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.73.0
          cache: true
      - name: Build ARM64 images
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --load \
            --cache-from=type=gha,scope=ci-api --cache-to=type=gha,mode=max,scope=ci-api \
            -t franchise-ci-api -f deployment/Dockerfile .
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --load \
            --cache-from=type=gha,scope=ci-migrations --cache-to=type=gha,mode=max,scope=ci-migrations \
            -t franchise-ci-migrations -f database/Dockerfile database
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --load \
            --cache-from=type=gha,scope=ci-bootstrap --cache-to=type=gha,mode=max,scope=ci-bootstrap \
            -t franchise-ci-bootstrap -f database/bootstrap/Dockerfile database/bootstrap
      - name: Scan images
        run: |
          set -eu
          for image in franchise-ci-api franchise-ci-migrations franchise-ci-bootstrap; do
            trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  ci-gate:
    name: CI gate
    if: always() && github.event_name == 'pull_request'
    needs: [branch-policy, application-quality, infrastructure, mutation, terraform-plan, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          APPLICATION_QUALITY_RESULT: ${{ needs.application-quality.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          TERRAFORM_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          TERRAFORM_PLAN_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          CONTAINERS_REQUIRED: ${{ github.base_ref == 'main' }}
          MUTATION_REQUIRED: ${{ github.base_ref == 'main' }}
        run: |
          set -eu
          for result in "$BRANCH_POLICY_RESULT" "$APPLICATION_QUALITY_RESULT" "$INFRASTRUCTURE_RESULT"; do
            test "$result" = success
          done
          if [ "$MUTATION_REQUIRED" = true ]; then
            test "$MUTATION_RESULT" = success
          else
            test "$MUTATION_RESULT" = skipped
          fi
          if [ "$TERRAFORM_PLAN_REQUIRED" = true ]; then
            test "$TERRAFORM_PLAN_RESULT" = success
          else
            test "$TERRAFORM_PLAN_RESULT" = skipped
          fi
          if [ "$CONTAINERS_REQUIRED" = true ]; then
            test "$CONTAINERS_RESULT" = success
          else
            test "$CONTAINERS_RESULT" = skipped
          fi

  deploy-dev:
    name: Deploy DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build application JAR
        run: |
          ./gradlew :app-service:bootJar --no-daemon --no-configuration-cache -x test
          cp applications/app-service/build/libs/ApiFranchise.jar ./ApiFranchise.jar
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.73.0
          cache: true
      - name: Reject superseded DEV commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          current=$(git ls-remote origin refs/heads/development | cut -f1)
          test "$current" = "$GITHUB_SHA"
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | jq \
            --arg sha "$GITHUB_SHA" \
            '[.[] | select(.base.ref == "development" and .merge_commit_sha == $sha and .merged_at != null)] | length')
          test "$merged" -eq 1
      - name: Install digest-preserving image copier
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Assume DEV deploy role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build, publish and scan immutable images
        run: |
          set -eu
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          tag="commit-$GITHUB_SHA"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"

          build_image() {
            component=$1
            dockerfile=$2
            context=$3
            repository="franchise-dev-$component"
            if ! aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push \
                --cache-from="type=gha,scope=ci-$component" --cache-to="type=gha,mode=max,scope=ci-$component" \
                -t "$registry/$repository:$tag" -f "$dockerfile" "$context"
            fi
            digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
              --query 'imageDetails[0].imageDigest' --output text)
            trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$registry/$repository@$digest"
            key=$(printf '%s' "$component" | tr '[:lower:]' '[:upper:]')
            printf '%s_DIGEST=%s\n' "$key" "$digest" >> "$GITHUB_ENV"
          }

          build_image api deployment/Dockerfile . &
          build_image migrations database/Dockerfile database &
          build_image bootstrap database/bootstrap/Dockerfile database/bootstrap &
          wait
          for component in api migrations bootstrap; do
            key=$(printf '%s' "$component" | tr '[:lower:]' '[:upper:]')
            grep -q "^${key}_DIGEST=" "$GITHUB_ENV" || { echo "Missing $key digest" >&2; exit 1; }
          done
      - name: Read current DEV release
        run: |
          set -eu
          if service=$(aws ecs describe-services --cluster franchise-dev-cluster --services franchise-dev-api --output json 2>/dev/null) && \
             [ "$(printf '%s' "$service" | jq -r '.services[0].status // empty')" = ACTIVE ]; then
            task_definition=$(printf '%s' "$service" | jq -r '.services[0].taskDefinition')
            previous_digest=$(aws ecs describe-task-definition --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='api'].image | [0]" --output text)
            printf 'INITIAL_DEPLOYMENT=false\nPREVIOUS_API_DIGEST=%s\n' "${previous_digest##*@}" >> "$GITHUB_ENV"
          else
            printf 'INITIAL_DEPLOYMENT=true\nPREVIOUS_API_DIGEST=\n' >> "$GITHUB_ENV"
          fi
      - name: Assume DEV apply role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_DEV_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare one-off task definitions
        run: |
          set -eu
          root=infrastructure/environments/dev
          terraform -chdir="$root" init -input=false
          set -- -var-file=dev.tfvars \
            -var "migration_image_digest=$MIGRATIONS_DIGEST" \
            -var "bootstrap_image_digest=$BOOTSTRAP_DIGEST"
          if [ "$INITIAL_DEPLOYMENT" = true ]; then
            set -- "$@" -var enable_api_service=false
          else
            set -- "$@" -var enable_api_service=true -var "api_image_digest=$PREVIOUS_API_DIGEST"
          fi
          terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m "$@"
          {
            printf 'ECS_CLUSTER=%s\n' "$(terraform -chdir="$root" output -raw ecs_cluster_name)"
            printf 'MIGRATION_TASK=%s\n' "$(terraform -chdir="$root" output -raw migration_task_definition_arn)"
            printf 'MIGRATION_NETWORK=%s\n' "$(terraform -chdir="$root" output -json migration_run_task_network_configuration | jq -c .)"
            printf 'BOOTSTRAP_TASK=%s\n' "$(terraform -chdir="$root" output -raw bootstrap_task_definition_arn)"
            printf 'BOOTSTRAP_NETWORK=%s\n' "$(terraform -chdir="$root" output -json bootstrap_run_task_network_configuration | jq -c .)"
          } >> "$GITHUB_ENV"
      - name: Assume DEV deploy role for database tasks
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Bootstrap initial DEV database
        if: env.INITIAL_DEPLOYMENT == 'true'
        run: infrastructure/scripts/run-ecs-task.sh "$ECS_CLUSTER" "$BOOTSTRAP_TASK" "$BOOTSTRAP_NETWORK" database-bootstrap
      - name: Run DEV migrations
        run: infrastructure/scripts/run-ecs-task.sh "$ECS_CLUSTER" "$MIGRATION_TASK" "$MIGRATION_NETWORK" migration
      - name: Assume DEV apply role for API deployment
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_DEV_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and verify DEV API
        run: |
          set -u
          root=infrastructure/environments/dev
          deploy() {
            terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m \
              -var-file=dev.tfvars \
              -var enable_api_service="$1" \
              -var "api_image_digest=$2" \
              -var "migration_image_digest=$MIGRATIONS_DIGEST" \
              -var "bootstrap_image_digest=$BOOTSTRAP_DIGEST"
          }

          set +e
          deploy true "$API_DIGEST"
          status=$?
          if [ "$status" -eq 0 ]; then
            endpoint=$(terraform -chdir="$root" output -raw api_endpoint)
            infrastructure/scripts/smoke-api.sh "$endpoint"
            status=$?
          fi
          set -e

          if [ "$status" -ne 0 ]; then
            if [ -n "$PREVIOUS_API_DIGEST" ]; then
              deploy true "$PREVIOUS_API_DIGEST"
            else
              terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m \
                -var-file=dev.tfvars -var enable_api_service=false \
                -var "migration_image_digest=$MIGRATIONS_DIGEST" \
                -var "bootstrap_image_digest=$BOOTSTRAP_DIGEST"
            fi
            exit "$status"
          fi
      - name: Assume DEV deploy role to mark release
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mark validated DEV digests
        run: |
          set -eu
          tag="deployed-$GITHUB_SHA"
          infrastructure/scripts/copy-ecr-image.sh franchise-dev-api "$API_DIGEST" franchise-dev-api "$tag"
          infrastructure/scripts/copy-ecr-image.sh franchise-dev-migrations "$MIGRATIONS_DIGEST" franchise-dev-migrations "$tag"
          infrastructure/scripts/copy-ecr-image.sh franchise-dev-bootstrap "$BOOTSTRAP_DIGEST" franchise-dev-bootstrap "$tag"
          for repository in franchise-dev-api franchise-dev-migrations franchise-dev-bootstrap; do
            aws ecr batch-delete-image --repository-name "$repository" \
              --image-ids "imageTag=commit-$GITHUB_SHA" >/dev/null
          done

  promote-prod:
    name: Promote PROD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment: prod
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5
      - name: Reject superseded PROD commit
        run: |
          set -eu
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA"
      - name: Install digest-preserving image copier
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Resolve approved DEV source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          development_sha=$(infrastructure/scripts/resolve-promotion-source.sh "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          printf 'DEVELOPMENT_SHA=%s\n' "$development_sha" >> "$GITHUB_ENV"
      - name: Assume PROD apply role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PROD_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure PROD foundation exists
        run: |
          set -eu
          root=infrastructure/environments/prod
          terraform -chdir="$root" init -input=false
          if service=$(aws ecs describe-services --cluster franchise-prod-cluster --services franchise-prod-api --output json 2>/dev/null) && \
             [ "$(printf '%s' "$service" | jq -r '.services[0].status // empty')" = ACTIVE ]; then
            task_definition=$(printf '%s' "$service" | jq -r '.services[0].taskDefinition')
            previous_digest=$(aws ecs describe-task-definition --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='api'].image | [0]" --output text)
            printf 'INITIAL_DEPLOYMENT=false\nPREVIOUS_API_DIGEST=%s\n' "${previous_digest##*@}" >> "$GITHUB_ENV"
          else
            terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m \
              -var-file=prod.tfvars -var enable_api_service=false
            printf 'INITIAL_DEPLOYMENT=true\nPREVIOUS_API_DIGEST=\n' >> "$GITHUB_ENV"
          fi
      - name: Assume PROD deploy role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Promote exact DEV digests to PROD
        run: |
          set -eu
          source_tag="deployed-$DEVELOPMENT_SHA"
          destination_tag="source-$DEVELOPMENT_SHA"
          api_digest=$(infrastructure/scripts/copy-ecr-image.sh franchise-dev-api "$source_tag" franchise-prod-api "$destination_tag")
          migrations_digest=$(infrastructure/scripts/copy-ecr-image.sh franchise-dev-migrations "$source_tag" franchise-prod-migrations "$destination_tag")
          bootstrap_digest=$(infrastructure/scripts/copy-ecr-image.sh franchise-dev-bootstrap "$source_tag" franchise-prod-bootstrap "$destination_tag")
          printf 'API_DIGEST=%s\nMIGRATIONS_DIGEST=%s\nBOOTSTRAP_DIGEST=%s\n' \
            "$api_digest" "$migrations_digest" "$bootstrap_digest" >> "$GITHUB_ENV"
      - name: Assume PROD apply role for task definitions
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PROD_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare PROD database tasks
        run: |
          set -eu
          root=infrastructure/environments/prod
          set -- -var-file=prod.tfvars \
            -var "migration_image_digest=$MIGRATIONS_DIGEST" \
            -var "bootstrap_image_digest=$BOOTSTRAP_DIGEST"
          if [ "$INITIAL_DEPLOYMENT" = true ]; then
            set -- "$@" -var enable_api_service=false
          else
            set -- "$@" -var enable_api_service=true -var "api_image_digest=$PREVIOUS_API_DIGEST"
          fi
          terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m "$@"
          {
            printf 'ECS_CLUSTER=%s\n' "$(terraform -chdir="$root" output -raw ecs_cluster_name)"
            printf 'MIGRATION_TASK=%s\n' "$(terraform -chdir="$root" output -raw migration_task_definition_arn)"
            printf 'MIGRATION_NETWORK=%s\n' "$(terraform -chdir="$root" output -json migration_run_task_network_configuration | jq -c .)"
            printf 'BOOTSTRAP_TASK=%s\n' "$(terraform -chdir="$root" output -raw bootstrap_task_definition_arn)"
            printf 'BOOTSTRAP_NETWORK=%s\n' "$(terraform -chdir="$root" output -json bootstrap_run_task_network_configuration | jq -c .)"
          } >> "$GITHUB_ENV"
      - name: Assume PROD deploy role for database tasks
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Bootstrap initial PROD database
        if: env.INITIAL_DEPLOYMENT == 'true'
        run: infrastructure/scripts/run-ecs-task.sh "$ECS_CLUSTER" "$BOOTSTRAP_TASK" "$BOOTSTRAP_NETWORK" database-bootstrap
      - name: Run PROD migrations
        run: infrastructure/scripts/run-ecs-task.sh "$ECS_CLUSTER" "$MIGRATION_TASK" "$MIGRATION_NETWORK" migration
      - name: Assume PROD apply role for API deployment
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PROD_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and verify PROD API
        run: |
          set -u
          root=infrastructure/environments/prod
          deploy() {
            terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m \
              -var-file=prod.tfvars \
              -var enable_api_service="$1" \
              -var "api_image_digest=$2" \
              -var "migration_image_digest=$MIGRATIONS_DIGEST" \
              -var "bootstrap_image_digest=$BOOTSTRAP_DIGEST"
          }

          set +e
          deploy true "$API_DIGEST"
          status=$?
          if [ "$status" -eq 0 ]; then
            endpoint=$(terraform -chdir="$root" output -raw api_endpoint)
            infrastructure/scripts/smoke-api.sh "$endpoint"
            status=$?
          fi
          set -e

          if [ "$status" -ne 0 ]; then
            if [ -n "$PREVIOUS_API_DIGEST" ]; then
              deploy true "$PREVIOUS_API_DIGEST"
            else
              terraform -chdir="$root" apply -auto-approve -input=false -lock-timeout=5m \
                -var-file=prod.tfvars -var enable_api_service=false \
                -var "migration_image_digest=$MIGRATIONS_DIGEST" \
                -var "bootstrap_image_digest=$BOOTSTRAP_DIGEST"
            fi
            exit "$status"
          fi
          printf 'API_ENDPOINT=%s\n' "$endpoint" >> "$GITHUB_ENV"
      - name: Assume PROD deploy role to record release
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Record PROD deployment manifest
        run: |
          set -eu
          tag="deployed-$GITHUB_SHA"
          infrastructure/scripts/copy-ecr-image.sh franchise-prod-api "$API_DIGEST" franchise-prod-api "$tag"
          infrastructure/scripts/copy-ecr-image.sh franchise-prod-migrations "$MIGRATIONS_DIGEST" franchise-prod-migrations "$tag"
          infrastructure/scripts/copy-ecr-image.sh franchise-prod-bootstrap "$BOOTSTRAP_DIGEST" franchise-prod-bootstrap "$tag"
          for repository in franchise-prod-api franchise-prod-migrations franchise-prod-bootstrap; do
            aws ecr batch-delete-image --repository-name "$repository" \
              --image-ids "imageTag=source-$DEVELOPMENT_SHA" >/dev/null
          done
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg mainSha "$GITHUB_SHA" \
            --arg developmentSha "$DEVELOPMENT_SHA" \
            --arg apiDigest "$API_DIGEST" \
            --arg migrationDigest "$MIGRATIONS_DIGEST" \
            --arg bootstrapDigest "$BOOTSTRAP_DIGEST" \
            --arg apiEndpoint "$API_ENDPOINT" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, repository: $repository, environment: "prod", mainSha: $mainSha,
              developmentSha: $developmentSha, apiDigest: $apiDigest,
              migrationDigest: $migrationDigest, bootstrapDigest: $bootstrapDigest,
              apiEndpoint: $apiEndpoint, deployedAt: $deployedAt}' \
            > deployment-manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prod-deployment-${{ github.sha }}
          path: deployment-manifest.json
          retention-days: 90
