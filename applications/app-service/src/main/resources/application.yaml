server:
  port: 8080
spring:
  application:
    name: "ApiFranchise"
  codec:
    max-in-memory-size: "${API_MAX_IN_MEMORY_SIZE:64KB}"
  devtools:
    add-properties: false
  profiles:
    include: null
logging:
  structured:
    format:
      console: "logstash"
api:
  swagger-ui:
    enabled: false
  deadline:
    timeout: "${API_DEADLINE_TIMEOUT:25s}"
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    schema: "franchise"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    ssl-mode: "${DB_SSL_MODE}"
    ssl-root-cert: "${DB_SSL_ROOT_CERT:}"
    initial-size: "${DB_POOL_INITIAL_SIZE:0}"
    max-size: "${DB_POOL_MAX_SIZE:15}"
    max-idle-time: "${DB_POOL_MAX_IDLE_TIME:30m}"
    max-acquire-time: "${DB_POOL_MAX_ACQUIRE_TIME:5s}"
    max-life-time: "${DB_POOL_MAX_LIFE_TIME:60m}"
    connect-timeout: "${DB_CONNECT_TIMEOUT:3s}"
    resilience:
      read:
        attempt-timeout: "${DB_READ_ATTEMPT_TIMEOUT:3s}"
        operation-timeout: "${DB_READ_OPERATION_TIMEOUT:10s}"
        circuit-breaker:
          failure-rate-threshold: "${DB_READ_CB_FAILURE_RATE:50}"
          slow-call-rate-threshold: "${DB_READ_CB_SLOW_RATE:50}"
          slow-call-duration-threshold: "${DB_READ_CB_SLOW_DURATION:2s}"
          sliding-window-size: "${DB_READ_CB_WINDOW_SIZE:20}"
          minimum-number-of-calls: "${DB_READ_CB_MIN_CALLS:10}"
          wait-duration-in-open-state: "${DB_READ_CB_OPEN_WAIT:30s}"
          permitted-number-of-calls-in-half-open-state: "${DB_READ_CB_HALF_OPEN_CALLS:3}"
      write:
        attempt-timeout: "${DB_WRITE_ATTEMPT_TIMEOUT:5s}"
        operation-timeout: "${DB_WRITE_OPERATION_TIMEOUT:15s}"
        circuit-breaker:
          failure-rate-threshold: "${DB_WRITE_CB_FAILURE_RATE:50}"
          slow-call-rate-threshold: "${DB_WRITE_CB_SLOW_RATE:50}"
          slow-call-duration-threshold: "${DB_WRITE_CB_SLOW_DURATION:3s}"
          sliding-window-size: "${DB_WRITE_CB_WINDOW_SIZE:20}"
          minimum-number-of-calls: "${DB_WRITE_CB_MIN_CALLS:10}"
          wait-duration-in-open-state: "${DB_WRITE_CB_OPEN_WAIT:30s}"
          permitted-number-of-calls-in-half-open-state: "${DB_WRITE_CB_HALF_OPEN_CALLS:3}"
      retry:
        max-attempts: "${DB_RETRY_MAX_ATTEMPTS:3}"
        min-backoff: "${DB_RETRY_MIN_BACKOFF:250ms}"
        max-backoff: "${DB_RETRY_MAX_BACKOFF:2s}"
        jitter: "${DB_RETRY_JITTER:0.5}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,r2dbc"
  metrics:
    tags:
      application: "${spring.application.name}"
      environment: "${APP_ENVIRONMENT:local}"
    distribution:
      percentiles:
        http.server.requests: "0.5,0.95,0.99"
      percentiles-histogram:
        http.server.requests: true
        resilience.r2dbc.operation: true
      slo:
        http.server.requests: "100ms,250ms,500ms,1s,2s,5s"
        resilience.r2dbc.operation: "2s,3s,5s,10s,15s"
cors:
  enabled: "${CORS_ENABLED:false}"
  allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
