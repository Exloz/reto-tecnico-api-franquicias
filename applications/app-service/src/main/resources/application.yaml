server:
  port: 8080
spring:
  application:
    name: "ApiFranchise"
  devtools:
    add-properties: false
  profiles:
    include: null
api:
  swagger-ui:
    enabled: false
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: "${DB_PORT:5432}"
    database: "${DB_NAME:franchise}"
    schema: "franchise"
    username: "${DB_USERNAME:franchise_app}"
    password: "${DB_PASSWORD:franchise_app}"
    ssl-mode: "${DB_SSL_MODE:DISABLE}"
    ssl-root-cert: "${DB_SSL_ROOT_CERT:}"
    initial-size: 0
    max-size: "${DB_POOL_MAX_SIZE:15}"
    max-idle-time: "30m"
aws:
  region: "us-east-1"
  secretName: "my-secret"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,r2dbc"
cors:
  enabled: false
  allowed-origins: "http://localhost:4200,http://localhost:8080"
