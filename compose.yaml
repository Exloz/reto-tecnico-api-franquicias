name: api-franchise

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: franchise
      POSTGRES_USER: franchise_migrator
      POSTGRES_PASSWORD: franchise_migrator
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init/001-create-application-role.sql:/docker-entrypoint-initdb.d/001-create-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franchise_migrator -d franchise"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrations:
    build:
      context: ./database
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/franchise
      FLYWAY_USER: franchise_migrator
      FLYWAY_PASSWORD: franchise_migrator
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: franchise
      DB_USERNAME: franchise_app
      DB_PASSWORD: franchise_app
      DB_POOL_MAX_SIZE: 15
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  k6:
    image: grafana/k6:0.57.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8080
      VUS: "${K6_VUS:-20}"
      DURATION: "${K6_DURATION:-2m}"
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["run", "/scripts/franchise-api.js"]

volumes:
  postgres-data:
