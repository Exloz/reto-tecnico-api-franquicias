def mutationThresholds = [
        model: 85,
        usecase: 85,
        'reactive-web': 70,
        'r2dbc-postgresql': 70,
        metrics: 60,
        'app-service': 60
]

allprojects {
    repositories {
        //mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'info.solidsoft.pitest'

    compileJava.dependsOn validateStructure

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    //build.dependsOn 'pitest'

    test {
        useJUnitPlatform()
        failFast = System.getenv('CI') != null
    }

    dependencies {
		implementation platform('software.amazon.awssdk:bom:2.46.8')
        implementation 'io.projectreactor:reactor-core'
        implementation 'io.projectreactor.addons:reactor-extra'

        testImplementation "io.projectreactor.tools:blockhound-junit-platform:${blockHoundVersion}"

        testImplementation 'io.projectreactor:reactor-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        pitest "org.pitest:pitest-history-plugin:${pitestHistoryVersion}"
    }

    tasks.withType(Test).configureEach {
        if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_13)) {
            jvmArgs += [
                    "-XX:+AllowRedefinitionToAddDeleteMethods"
            ]
        }
    }

    test.finalizedBy(project.tasks.jacocoTestReport)

    pitest {
        targetClasses = ['co.com.pragma.*']
        excludedClasses = []
        excludedTestClasses = ['co.com.pragma.r2dbc.PostgresqlAdaptersIntegrationTest']
        pitestVersion = '1.25.4'
        verbose = false
        outputFormats = ['XML', 'HTML']
        threads = project.name == 'r2dbc-postgresql' ? 1 : (System.getenv('CI') != null ? 2 : 8)
        exportLineCoverage = true
        useClasspathFile = true
        withHistory = true
        timestampedReports = false
        //mutators = ['STRONGER', 'DEFAULTS']
        fileExtensionsToFilter.addAll('xml', 'orbit')
        junit5PluginVersion = '1.2.3'
        failWhenNoMutations = false
        mutationThreshold = mutationThresholds.getOrDefault(project.name, 60)
        coverageThreshold = mutationThresholds.getOrDefault(project.name, 60)
        testStrengthThreshold = mutationThresholds.getOrDefault(project.name, 60)
        jvmArgs = [
                "-XX:+AllowRedefinitionToAddDeleteMethods",
                "-Dmigration.path=${rootProject.file('database/migrations').absolutePath}",
                "-Dproject.rootDir=${rootProject.projectDir.absolutePath}"
        ]
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.setRequired true
            xml.setOutputLocation layout.buildDirectory.file("reports/jacoco.xml")
            csv.setRequired false
            html.setOutputLocation layout.buildDirectory.dir("reports/jacocoHtml")
        }
    }

}

project(':app-service').tasks.named('test') {
    mustRunAfter project(':r2dbc-postgresql').tasks.named('test')
}

project(':app-service').tasks.named('pitest') {
    mustRunAfter project(':r2dbc-postgresql').tasks.named('pitest')
}

jacoco {
    toolVersion = "${jacocoVersion}"
    reportsDirectory.set(layout.buildDirectory.dir("reports"))
}

tasks.register('jacocoMergedReport', JacocoReport) {
    dependsOn = [test, subprojects.jacocoTestReport]
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.sourceSets.main.output)
    executionData.setFrom files(subprojects.collect {
        it.layout.buildDirectory.file('jacoco/test.exec')
    })
    reports {
        xml.setRequired true
        csv.setRequired false
        html.setRequired true
    }
}

tasks.register('jacocoMergedCoverageVerification', JacocoCoverageVerification) {
    dependsOn subprojects.test
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.sourceSets.main.output)
    executionData.setFrom files(subprojects.collect {
        it.layout.buildDirectory.file('jacoco/test.exec')
    })
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.register('qualityGate') {
    dependsOn validateStructure, jacocoMergedCoverageVerification
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

tasks.register('pitestReportAggregate') {
    dependsOn subprojects.collect { it.tasks.named('pitest') }
    notCompatibleWithConfigurationCache('PIT aggregate reads subproject XML reports at execution time')
    def rootReportDir = layout.buildDirectory.dir("reports/pitest")
    def subprojectReports = subprojects.collect { subproject ->
        subproject.layout.buildDirectory.file("reports/pitest/mutations.xml")
    }
    inputs.files(subprojectReports)
    outputs.file(rootReportDir.map { it.file("mutations.xml") })

    doLast {
        def reportDir = rootReportDir.get().asFile
        def consolidatedReport = new File(reportDir, 'mutations.xml')
        consolidatedReport.withWriter { writer ->
            writer.write("<mutations>\n")
            subprojectReports.each { reportProvider ->
                def xmlReport = reportProvider.get().asFile
                if (xmlReport.exists()) {
                    def xmlContent = xmlReport.text
                    xmlContent = xmlContent.replaceAll("<\\?xml[^>]*>", "")
                    xmlContent = xmlContent.replaceAll("</?mutations( partial=\"true\")?>", "")
                    writer.write(xmlContent.trim() + "\n")
                }
            }
            writer.write("</mutations>")
        }
    }
}

tasks.register('qualityReport') {
    dependsOn jacocoMergedReport, pitestReportAggregate
}

tasks.named('wrapper') {
    gradleVersion = '9.5.1'
}
